name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the pain point or limitation you're running into?
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? How would you like it to work?
    validations:
      required: true

  - type: checkboxes
    id: platform
    attributes:
      label: ECU platform
      options:
        - label: ME7
        - label: MED9
        - label: MED17
        - label: Motronic
        - label: All platforms

  - type: dropdown
    id: area
    attributes:
      label: Calibration area
      options:
        - Fueling (KRKTE)
        - MAF (MLHFM)
        - Torque/Load (KFMIOP/KFMIRL)
        - Ignition (KFZW/KFZWOP)
        - Boost control (LDRPID)
        - Optimizer
        - Data Logger
        - Sniffer
        - Dual Injection
        - Other
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered?
    validations:
      required: false

name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  determine-runner:
    name: Determine Runner
    runs-on: ubuntu-latest
    outputs:
      runner-type: ${{ steps.select.outputs.runner }}
    steps:
      - name: Pick an idle self-hosted macOS runner
        id: select
        env:
          GH_PAT_WORKFLOW: ${{ secrets.GH_PAT_WORKFLOW }}
        run: |
          set -euo pipefail
          FALLBACK='"macos-latest"'
          if [ -z "${GH_PAT_WORKFLOW:-}" ]; then
            echo "::notice::GH_PAT_WORKFLOW not configured for runner lookup — falling back to hosted macOS"
            echo "runner=$FALLBACK" >> "$GITHUB_OUTPUT"; exit 0
          fi
          JSON=$(curl -s -H "Authorization: Bearer $GH_PAT_WORKFLOW" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100" || true)
          IDLE=$(echo "$JSON" | jq '[.runners[]? | select(.os=="macOS" and .status=="online" and .busy==false)] | length' 2>/dev/null || echo 0)
          if [ "${IDLE:-0}" -gt 0 ]; then
            echo 'runner=["self-hosted", "macOS"]' >> "$GITHUB_OUTPUT"
            echo "Idle self-hosted macOS runner available — using self-hosted (fill local before paying for hosted)"
          else
            echo "::notice::No idle self-hosted macOS runner — using hosted fallback"
            echo "runner=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        run: |
          # Latest STABLE tag (ignore -beta pre-release tags)
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v beta | head -1)
          if [ -z "$LATEST_TAG" ]; then
            AUTO_VERSION=$(grep '^app.version=' gradle.properties | cut -d'=' -f2)
          else
            CURRENT=${LATEST_TAG#v}
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            AUTO_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          # gradle.properties app.version is a manual floor for intentional minor/major
          # bumps; the greater of (auto-incremented patch, app.version) wins. Routine
          # releases leave app.version below the tag line and get the auto patch bump.
          APP_VERSION=$(grep '^app.version=' gradle.properties | cut -d'=' -f2)
          VERSION=$(printf '%s\n%s\n' "$AUTO_VERSION" "$APP_VERSION" | sort -V | tail -1)
          echo "Auto: v${AUTO_VERSION}  Floor(app.version): v${APP_VERSION}  ->  Release: v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [determine-runner, check-version, test]
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner-type) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package DMG and uber JAR
        run: ./gradlew packageDmg packageUberJarForCurrentOS -Papp.version=${{ needs.check-version.outputs.version }}

      - name: Rename uber JAR
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-macos-aarch64.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/jars/*.jar

  build-windows:
    needs: [check-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package MSI and uber JAR
        shell: bash
        run: ./gradlew packageMsi packageUberJarForCurrentOS "-Papp.version=${{ needs.check-version.outputs.version }}"

      - name: Rename uber JAR
        shell: bash
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-windows-x64.jar"

      - name: Create portable ZIP (bundled runtime, no Java required)
        shell: pwsh
        run: |
          ./gradlew createDistributable "-Papp.version=${{ needs.check-version.outputs.version }}"
          $Version = "${{ needs.check-version.outputs.version }}"
          Compress-Archive -Path build/compose/binaries/main/app/MxT -DestinationPath "MxT-$Version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/jars/*.jar
            MxT-*-windows-x64.zip

  build-linux:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Package DEB and uber JAR
        run: ./gradlew packageDeb packageUberJarForCurrentOS -Papp.version=${{ needs.check-version.outputs.version }}

      - name: Create portable tar.gz and rename uber JAR
        run: |
          ./gradlew createDistributable -Papp.version=${{ needs.check-version.outputs.version }}
          VERSION=${{ needs.check-version.outputs.version }}
          tar -czf "MxT-${VERSION}-linux-x64.tar.gz" \
            -C build/compose/binaries/main/app .
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-linux-x64.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/jars/*.jar
            MxT-*-linux-x64.tar.gz

  release:
    needs: [check-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p flat
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.jar' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} flat/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: MxT ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: flat/*

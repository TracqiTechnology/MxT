name: Pull Request Tests

on:
  pull_request:
    branches: [develop, master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Regression suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run complete regression suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew test

      - name: Run complete regression suite
        if: runner.os != 'Linux'
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-request-test-report-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/test/
            build/test-results/test/

  required-gate:
    name: Required PR Gate
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform suite to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = "success"

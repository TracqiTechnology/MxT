name: Pre-Release

on:
  push:
    branches: [develop]

concurrency:
  group: pre-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-runner:
    name: Determine Runner
    runs-on: ubuntu-latest
    outputs:
      runner-type: ${{ steps.select.outputs.runner }}
    steps:
      - name: Pick an idle self-hosted macOS runner
        id: select
        env:
          GH_PAT_WORKFLOW: ${{ secrets.GH_PAT_WORKFLOW }}
        run: |
          set -euo pipefail
          FALLBACK='"macos-latest"'
          if [ -z "${GH_PAT_WORKFLOW:-}" ]; then
            echo "::notice::GH_PAT_WORKFLOW not configured for runner lookup — falling back to hosted macOS"
            echo "runner=$FALLBACK" >> "$GITHUB_OUTPUT"; exit 0
          fi
          JSON=$(curl -s -H "Authorization: Bearer $GH_PAT_WORKFLOW" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100" || true)
          IDLE=$(echo "$JSON" | jq '[.runners[]? | select(.os=="macOS" and .status=="online" and .busy==false)] | length' 2>/dev/null || echo 0)
          if [ "${IDLE:-0}" -gt 0 ]; then
            echo 'runner=["self-hosted", "macOS"]' >> "$GITHUB_OUTPUT"
            echo "Idle self-hosted macOS runner available — using self-hosted (fill local before paying for hosted)"
          else
            echo "::notice::No idle self-hosted macOS runner — using hosted fallback"
            echo "runner=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run tests
        run: xvfb-run -a ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: build/reports/tests/test/

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute beta version from latest stable tag
        id: version
        run: |
          # Find the latest stable (non-beta) tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v beta | head -1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION=$(grep '^app.version=' gradle.properties | cut -d'=' -f2)
            BETA_NUM=$(git rev-list --count HEAD)
          else
            CURRENT=${LATEST_TAG#v}
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BETA_NUM=$(git rev-list --count "${LATEST_TAG}..HEAD")
          fi

          # gradle.properties app.version is a manual floor for intentional minor/major
          # bumps; the greater of (auto patch, app.version) wins so betas track it too.
          APP_VERSION=$(grep '^app.version=' gradle.properties | cut -d'=' -f2)
          VERSION=$(printf '%s\n%s\n' "$VERSION" "$APP_VERSION" | sort -V | tail -1)

          # Display version for tags, JAR names, and GitHub release title
          DISPLAY_VERSION="${VERSION}-beta.${BETA_NUM}"
          # Native package version — use the base 3-segment version (MAJOR.MINOR.PATCH).
          # DMG requires PATCH to be a simple integer, MSI requires BUILD <= 65535.
          # The beta identifier is only carried in the display version / release title.
          PKG_VERSION="${VERSION}"

          echo "Next pre-release: v${DISPLAY_VERSION} (native packages: ${PKG_VERSION})"
          echo "version=${DISPLAY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [determine-runner, check-version, test]
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner-type) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Package DMG (numeric version) and uber JAR (display version)
        run: |
          ./gradlew packageDmg -Papp.version=${{ needs.check-version.outputs.version }} -Ppkg.version=${{ needs.check-version.outputs.pkg_version }}
          ./gradlew packageUberJarForCurrentOS -Papp.version=${{ needs.check-version.outputs.version }}

      - name: Rename uber JAR
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-macos-aarch64.jar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-aarch64
          path: |
            build/compose/binaries/main/dmg/*.dmg
            build/compose/jars/*.jar

  build-windows:
    needs: [check-version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Package MSI (numeric version) and uber JAR (display version)
        shell: bash
        run: |
          ./gradlew packageMsi "-Papp.version=${{ needs.check-version.outputs.version }}" "-Ppkg.version=${{ needs.check-version.outputs.pkg_version }}"
          ./gradlew packageUberJarForCurrentOS "-Papp.version=${{ needs.check-version.outputs.version }}"

      - name: Rename uber JAR
        shell: bash
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-windows-x64.jar"

      - name: Create portable ZIP (bundled runtime, no Java required)
        shell: pwsh
        run: |
          ./gradlew createDistributable "-Papp.version=${{ needs.check-version.outputs.version }}" "-Ppkg.version=${{ needs.check-version.outputs.pkg_version }}"
          $Version = "${{ needs.check-version.outputs.version }}"
          Compress-Archive -Path build/compose/binaries/main/app/MxT -DestinationPath "MxT-$Version-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packages
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/jars/*.jar
            MxT-*-windows-x64.zip

  build-linux:
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Package DEB (numeric version) and uber JAR (display version)
        run: |
          ./gradlew packageDeb -Papp.version=${{ needs.check-version.outputs.version }} -Ppkg.version=${{ needs.check-version.outputs.pkg_version }}
          ./gradlew packageUberJarForCurrentOS -Papp.version=${{ needs.check-version.outputs.version }}

      - name: Create portable tar.gz and rename uber JAR
        run: |
          ./gradlew createDistributable -Papp.version=${{ needs.check-version.outputs.version }} -Ppkg.version=${{ needs.check-version.outputs.pkg_version }}
          VERSION=${{ needs.check-version.outputs.version }}
          tar -czf "MxT-${VERSION}-linux-x64.tar.gz" \
            -C build/compose/binaries/main/app .
          mv build/compose/jars/*.jar "build/compose/jars/MxT-${VERSION}-linux-x64.jar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            build/compose/binaries/main/deb/*.deb
            build/compose/jars/*.jar
            MxT-*-linux-x64.tar.gz

  pre-release:
    needs: [check-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete previous beta pre-releases
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const release of releases.data) {
              if (release.prerelease && release.tag_name.includes('-beta.')) {
                console.log(`Deleting pre-release: ${release.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`Deleted tag: ${release.tag_name}`);
                } catch (e) {
                  console.log(`Tag ${release.tag_name} already gone`);
                }
              }
            }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p flat
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.jar' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} flat/ \;

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: MxT ${{ needs.check-version.outputs.version }} (Beta)
          generate_release_notes: true
          prerelease: true
          files: flat/*
